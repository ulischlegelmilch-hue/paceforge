# Render-Blueprint fürs PaceForge-Backend (Fastify).
# In render.com: "New +" -> "Blueprint" -> dieses Repo wählen. Render liest diese
# Datei und legt den Web-Service an.
#
# Deploy vom Monorepo-Root (nicht aus server/), damit die npm-Workspaces installiert
# werden und @paceforge/core aufgelöst wird. Der Start-Befehl läuft den server-
# Workspace (tsx transpiliert die geteilte TS-Kernlogik zur Laufzeit).
#
# Free-Tier reicht zum Loslegen (schläft nach ~15 min Inaktivität ein, für die App
# unkritisch – Aufrufe haben immer einen lokalen Fallback).
services:
  - type: web
    name: paceforge-backend
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start --workspace @paceforge/server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Optional: mit Key nutzt /api/parse-goal Claude, sonst den Regel-Fallback.
      # Im Render-Dashboard setzen (nicht committen).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Nötig für die inoffizielle Garmin-Connect-Anbindung (server/src/garmin.ts):
      # verschlüsselt die gespeicherten Garmin-Session-Tokens (AES-256-GCM). Ohne
      # diesen Wert bleibt /api/garmin/login mit 503 deaktiviert. Einen zufälligen,
      # langen String setzen (z.B. `openssl rand -hex 32`) und NICHT committen.
      - key: GARMIN_TOKEN_ENCRYPTION_KEY
        sync: false
      # Optional: dauerhafte Sync-Snapshot-Ablage (Upstash Redis, REST-API).
      # Ohne diese Werte läuft der Server mit In-Memory-Ablage weiter (verliert
      # Snapshots bei jedem Neustart/Deploy/Einschlafen des Free-Tiers).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
